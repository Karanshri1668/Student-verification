<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ORBIT Event Control Panel</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="background-glow"></div>

<header>

    <h1>ORBIT</h1>

    <p>Event Control Panel</p>

</header>

<section class="dashboard">

    <div class="card" data-event="aiprompt">

        <div class="icon">🤖</div>

        <h2>AI Prompt Battle</h2>

        <p>Duo AI Prompt Engineering Competition</p>

    </div>

    <div class="card" data-event="debugging">

        <div class="icon">🐞</div>

        <h2>Debugging</h2>

        <p>Find & Fix Code Errors</p>

    </div>

    <div class="card" data-event="techquiz">

        <div class="icon">🧠</div>

        <h2>Tech Quiz</h2>

        <p>4 Member Technical Quiz</p>

    </div>

    <div class="card" data-event="gaming">

        <div class="icon">🎮</div>

        <h2>Gaming</h2>

        <p>BGMI & Free Fire Tournament</p>

    </div>

    <div class="card" data-event="relay">

        <div class="icon">⚡</div>

        <h2>Relay</h2>

        <p>Relay Coding Challenge</p>

    </div>

</section>

<script src="js/script.js"></script>
</body>

</html>
