<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Relay Dashboard</title>

    <link rel="stylesheet" href="css/relay.css">

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>

<body>

<header>

    <h1>Relay</h1>

    <p>Participant Verification</p>

</header>


<!--====================================
VERIFY SECTION
=====================================-->

<section class="verify-section">

    <h2>Verify Participant</h2>

    <div class="verify-box">

        <input
            type="text"
            id="verifyInput"
            placeholder="Enter Participant Unique ID"
            autocomplete="off"
        >

        <button id="verifyBtn">

            Verify

        </button>

    </div>

    <div id="verifyResult"></div>

</section>


<!--====================================
REGISTERED TEAMS
=====================================-->

<section class="teams-section">

    <h2>Registered Teams</h2>

    <div id="teams">

        <!-- Relay teams loaded here -->

    </div>

</section>


<script src="js/relay.js"></script>

</body>

</html>
